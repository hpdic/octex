name: Bug report
description: A wrong result, a crash, or an unexpected slowdown
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: For a recall problem, include the dataset (or how to generate it), the build and search parameters, and the recall you expected.
    validations: {required: true}
  - type: textarea
    attributes:
      label: Reproducing script
      render: python
    validations: {required: true}
  - type: input
    attributes:
      label: Versions
      description: octex, libcuvs, the CUDA driver, and the GPU model
    validations: {required: true}
